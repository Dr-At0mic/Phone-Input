name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.9.0 for testing updates); empty = the default in build.gradle.kts"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # v1.2.3 tag → 1.2.3; a manual run can pass a version; other builds use the version in build.gradle.kts
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '' }}
  APP_VERSION_ARG: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.version) && format('-PappVersion={0}', startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version) || '' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:desktopTest --stacktrace
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: composeApp/build/reports/tests/

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease ${{ env.APP_VERSION_ARG }} --stacktrace
      - name: Rename
        run: |
          version=$(echo "${APP_VERSION#v}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || echo dev)
          mkdir dist
          apk=$(ls composeApp/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "dist/PhoneInput-$version.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  linux:
    name: Linux DEB + RPM
    needs: test
    # Oldest supported Ubuntu: jpackage records this system's package names as dependencies
    # (libasound2), which newer releases still provide (libasound2t64), so the .deb installs on both.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - run: ./gradlew :composeApp:packageDeb :composeApp:packageRpm ${{ env.APP_VERSION_ARG }} --stacktrace
      - name: Rename
        run: |
          version=$(echo "${APP_VERSION#v}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || echo dev)
          mkdir dist
          cp composeApp/build/compose/binaries/main/deb/*.deb "dist/phoneinput_${version}_amd64.deb"
          cp composeApp/build/compose/binaries/main/rpm/*.rpm "dist/phoneinput-${version}.x86_64.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows MSI
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:packageMsi ${{ env.APP_VERSION_ARG }} --stacktrace
        shell: bash
      - name: Rename
        shell: bash
        run: |
          version=$(echo "${APP_VERSION#v}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || echo dev)
          mkdir dist
          cp composeApp/build/compose/binaries/main/msi/*.msi "dist/PhoneInput-$version.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PhoneInput $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
